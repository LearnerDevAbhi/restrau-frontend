<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7F1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Scan, browse the menu and order from your table." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&display=swap"
    />
    <title>Menu</title>
    <style>
      /* Painted before any JS loads, so a QR scan never lands on a blank white screen */
      html, body { background: #fbf7f1; margin: 0; }
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #fbf7f1; z-index: 100; transition: opacity 0.25s ease; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark { width: 56px; height: 56px; border-radius: 16px; background: #c2410c; animation: splash-pulse 1.1s ease-in-out infinite; }
      @keyframes splash-pulse { 0%, 100% { transform: scale(0.92); opacity: 0.85; } 50% { transform: scale(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash .mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="mark"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
